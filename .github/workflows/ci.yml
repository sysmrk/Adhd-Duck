name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Build
        run: go build ./cmd/controller ./cmd/worker

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

  integration:
    name: Integration tests (containerd ${{ matrix.containerd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containerd: ["1.7.36", "2.4.2"]
    env:
      CONTAINERD_VERSION: ${{ matrix.containerd }}
      SOCK: /run/adhdduck-ci/containerd.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      # A containerd of our own, next to the runner's (Docker's), with its own
      # root, state and socket: overlayfs snapshotter and CRI, as on the nodes.
      - name: Start containerd ${{ env.CONTAINERD_VERSION }}
        run: |
          curl --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 180 -fsSL -o /tmp/containerd.tgz \
            "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-amd64.tar.gz"
          mkdir -p /tmp/containerd && tar -xzf /tmp/containerd.tgz -C /tmp/containerd
          cat > /tmp/containerd/config.toml <<'EOF'
          version = 2
          root = "/var/lib/adhdduck-ci"
          state = "/run/adhdduck-ci"
          [grpc]
            address = "/run/adhdduck-ci/containerd.sock"
          [plugins."io.containerd.grpc.v1.cri"]
            disable_apparmor = true
            [plugins."io.containerd.grpc.v1.cri".containerd]
              snapshotter = "overlayfs"
          EOF
          sudo mkdir -p /var/lib/adhdduck-ci /run/adhdduck-ci
          sudo sh -c 'nohup /tmp/containerd/bin/containerd --config /tmp/containerd/config.toml > /tmp/containerd/containerd.log 2>&1 &'
          for i in $(seq 1 30); do
            sudo /tmp/containerd/bin/ctr -a "$SOCK" version >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::containerd didn't start"; sudo cat /tmp/containerd/containerd.log; exit 1

      - name: Download modules
        run: go mod download

      # As root: the tests mount snapshots to compare what transfers produced.
      - name: Integration tests
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            ADHDDUCK_CONTAINERD="$SOCK" \
            go test -tags integration -count=1 -timeout 15m ./internal/worker/

      - name: containerd log
        if: failure()
        run: sudo tail -n 200 /tmp/containerd/containerd.log 2>/dev/null || true

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint helm/adhdduck
      - run: |
          helm template test helm/adhdduck --namespace custom > rendered.yaml
          grep -q 'adhdduck-controller.custom.svc.cluster.local' rendered.yaml
          helm template test helm/adhdduck --set networkPolicy.enabled=false > /dev/null
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/test-chart.py

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        component: [controller, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          file: app/Dockerfile.${{ matrix.component }}
          push: false
          load: true
          tags: adhdduck-${{ matrix.component }}:verify
          platforms: linux/amd64
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: adhdduck-${{ matrix.component }}:verify
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          exit-code: '1'

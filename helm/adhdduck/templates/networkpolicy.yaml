{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adhdduck-api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adhdduck
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adhdduck
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 18081}
    {{- with .Values.networkPolicy.monitoringPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 18081}
    {{- end }}
    {{- with .Values.networkPolicy.webhookPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8080}
    {{- end }}
{{- end }}

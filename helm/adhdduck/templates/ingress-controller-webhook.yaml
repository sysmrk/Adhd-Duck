{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adhdduck-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: adhdduck
    app.kubernetes.io/component: controller
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "adhdduck.internal"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "{{ .Release.Namespace }}/adhdduck-peer-tls"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Exact
            backend:
              service:
                name: adhdduck-controller
                port:
                  number: 8080
{{- end }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adhdduck-webhook
  namespace: adhdduck
  labels:
    app.kubernetes.io/name: adhdduck
    app.kubernetes.io/component: controller
spec:
  ingressClassName: nginx
  rules:
    - host: adhdduck.example.com
      http:
        paths:
          - path: /webhook/preheat
            pathType: Exact
            backend:
              service:
                name: adhdduck-controller
                port:
                  number: 8080

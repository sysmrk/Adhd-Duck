apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adhdduck-webhook
  namespace: adhdduck
  labels:
    app.kubernetes.io/name: adhdduck
    app.kubernetes.io/component: controller
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "adhdduck.internal"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "adhdduck/adhdduck-peer-tls"
spec:
  ingressClassName: nginx
  rules:
    - host: adhdduck.example.com
      http:
        paths:
          - path: /webhook/preheat
            pathType: Exact
            backend:
              service:
                name: adhdduck-controller
                port:
                  number: 8080

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: adhdduck-worker
  namespace: adhdduck
  labels:
    release: prometheus
    app.kubernetes.io/name: adhdduck
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: adhdduck
      app.kubernetes.io/component: worker
  namespaceSelector:
    matchNames:
      - adhdduck
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
